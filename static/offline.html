<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafb" />
    <meta name="color-scheme" content="light dark" />
    <title>오프라인 - LawCast</title>
    <style>
      :root { color-scheme: light; --bg: #fafafb; --text: #0f172a; --muted: #475569; background: var(--bg); }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      p { line-height: 1.7; color: var(--muted); }
      a { display: inline-block; padding: .75rem 1.25rem; background: #1d4ed8; color: white; border-radius: .5rem; text-decoration: none; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { color-scheme: dark; --bg: #0b1117; --text: #f8fafc; --muted: #cbd5e1; } }
      :root[data-theme='dark'] { color-scheme: dark; --bg: #0b1117; --text: #f8fafc; --muted: #cbd5e1; }
    </style>
    <script>
      (() => {
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem('lawcast-theme');
        } catch { /* Use the system theme when storage is unavailable. */ }
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b1117' : '#fafafb';
      })();
    </script>
  </head>
  <body>
    <main data-testid="pwa-offline-page">
      <img src="/brand/v2/icon-192.png" width="96" height="96" alt="LawCast" />
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>최신 입법예고를 확인하려면 인터넷 연결이 필요합니다. 연결 후 다시 시도해 주세요.</p>
      <a href="/" data-testid="pwa-offline-retry">다시 시도</a>
    </main>
  </body>
</html>
