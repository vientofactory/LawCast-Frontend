<!doctype html>
<html lang="ko" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/brand/v2/favicon.png"
		/>
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/brand/v2/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/brand/v2/apple-touch-icon.png"
		/>
		<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1d4ed8" />
		<meta name="color-scheme" content="light dark" />
		<script>
			(() => {
				const storageKey = 'lawcast-theme';
				const root = document.documentElement;
				const savedTheme = window.localStorage.getItem(storageKey);
				const preferredTheme =
					savedTheme === 'light' || savedTheme === 'dark'
						? savedTheme
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';

				root.dataset.theme = preferredTheme;
				root.style.colorScheme = preferredTheme;
				const metaThemeColor = document.querySelector('meta[name="theme-color"]');
				if (metaThemeColor) {
					metaThemeColor.setAttribute('content', preferredTheme === 'dark' ? '#08111f' : '#3b82f6');
				} else {
					const meta = document.createElement('meta');
					meta.name = 'theme-color';
					meta.content = preferredTheme === 'dark' ? '#08111f' : '#3b82f6';
					document.head.appendChild(meta);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="%sveltekit.theme%">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
