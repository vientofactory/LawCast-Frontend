name: Web vitals regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-vitals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-vitals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11.13.0
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint && git diff --exit-code
      - name: Type check
        run: npm run check
      - name: Test Lighthouse summaries
        run: node --test scripts/lighthouse-summary.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Test revision history and scroll navigation
        env:
          DIFFCHAIN_UI_MOCK: '1'
        run: npx --no-install playwright test --config playwright-configs/playwright.config.ts e2e/revision-history.spec.ts e2e/navigation-scroll.spec.ts
      - name: Test production build
        run: npm run test:e2e:web-vitals
      - name: Test SSR API consumers
        run: npx --no-install playwright test --config playwright-configs/playwright.consumers.config.ts
