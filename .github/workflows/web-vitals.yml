name: Web vitals regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-vitals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-vitals:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.13.0
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Lint
        run: npm run lint && git diff --exit-code
      - name: Type check
        run: npm run check
      - name: Test Lighthouse summaries
        run: node --test scripts/lighthouse-summary.test.mjs
      - name: Test request failure classification
        run: node --test scripts/request-failure.test.mjs
      - name: Test CI installation guards
        run: node --test scripts/ci-install.test.mjs
      - name: Set up cached Chromium
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - name: Test revision history, scroll navigation and share images
        env:
          DIFFCHAIN_UI_MOCK: '1'
        run: npx --no-install playwright test --config playwright-configs/playwright.config.ts e2e/revision-history.spec.ts e2e/revision-text-diff.spec.ts e2e/revision-history-pagination.spec.ts e2e/navigation-scroll.spec.ts e2e/seo-images.spec.ts
      - name: Test production build
        run: npm run test:e2e:web-vitals
      - name: Test hard reload styles and preserved brand animation
        run: npx --no-install playwright test --config playwright-configs/playwright.hard-reload.config.ts
      - name: Test request failure recovery
        run: |
          echo "::notice title=Intentional HTTP failures::This suite injects HTTP 429 and other failures through a local fixture. Application error logs are expected; every Playwright assertion must still pass."
          npx --no-install playwright test --config playwright-configs/playwright.load-failures.config.ts
      - name: Test open layout and accessibility
        run: npx --no-install playwright test --config playwright-configs/playwright.open-layout.config.ts
      - name: Test SSR API consumers
        run: npx --no-install playwright test --config playwright-configs/playwright.consumers.config.ts

  prepare-shared-browsers:
    name: Prepare shared browser caches
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11.13.0
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Warm compatible cross-browser downloads once
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium firefox webkit

  shared-ui:
    name: Shared UI (${{ matrix.suite }})
    needs: prepare-shared-browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [notifications, screenshot-modal, theme-states, framework-cloudflare, analytics, pwa]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11.13.0
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Set up cached browser engines and system dependencies
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium firefox webkit
      - name: Test shared UI across browser engines
        env:
          DIFFCHAIN_UI_MOCK: '1'
          PWA_CLOUDFLARE: ${{ matrix.suite == 'pwa' && '1' || '0' }}
        run: npx --no-install playwright test --config playwright-configs/playwright.${{ matrix.suite }}.config.ts
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-ui-${{ matrix.suite }}
          path: test-results/
          retention-days: 7
